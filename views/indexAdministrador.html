<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portal de gestão RBS - Dashboard administrativo">
    <title>RBS Patrocinadores | Dashboard</title>
    <link rel="stylesheet" href="../assets/css/style_portal.css">
    <script src="../src/guards/security.js"></script>
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar"></aside>

        <div class="main-area">
            <header class="topbar"></header>

            <main class="content" id="dashboard">
                <section class="secao-patrocinadores">
                    <div class="patrocinadores-topo">
                        <div class="patrocinadores-titulos">
                            <h1>Patrocinadores</h1>
                            <p>Gerencie as marcas patrocinadoras, cotas e entregas do evento.</p>
                        </div>

                        <div class="patrocinadores-filtros">
                            <div class="campo-busca">
                                <input type="search" id="buscarPatrocinador" placeholder="Buscar por nome ou CNPJ..."
                                    aria-label="Buscar por nome ou CNPJ">
                            </div>

                            <select id="filtrarCota" aria-label="Filtrar por cota">
                                <option value="">Todas as cotas</option>
                            </select>

                            <div class="new-sponsor-wrapper">
                                <button class="button button-novo-filtro" type="button" id="newSponsorButton"
                                    aria-expanded="false" aria-controls="newSponsorForm">
                                    <svg viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M12 5v14M5 12h14" />
                                    </svg>
                                    Novo patrocinador
                                </button>

                                <div class="new-sponsor-form" id="newSponsorForm">
                                    <div class="form-header">
                                        <div>
                                            <h3>Novo patrocinador</h3>
                                            <p>Cadastre um novo patrocinador na plataforma.</p>
                                        </div>
                                        <button type="button" class="close-form" id="closeSponsorForm"
                                            aria-label="Fechar">
                                            ×
                                        </button>
                                    </div>

                                    <form id="sponsorForm">
                                        <div class="form-group">
                                            <label for="sponsorName">Nome da empresa</label>
                                            <input type="text" id="sponsorName" name="nome"
                                                placeholder="Ex.: Aurora Alimentos" required>
                                        </div>

                                        <div class="form-group">
                                            <label for="sponsorCnpj">CNPJ</label>
                                            <input type="text" id="sponsorCnpj" name="cnpj"
                                                placeholder="00.000.000/0000-00" maxlength="18" required>
                                        </div>

                                        <div class="form-group">
                                            <div class="dynamic-emails-header">
                                                <label>E-mails autorizados</label>
                                                <button type="button" class="btn-icon-add" id="btnAddSponsorEmailRow"
                                                    title="Adicionar linha de e-mail">+</button>
                                            </div>
                                            <div class="dynamic-emails-scroll" id="sponsorEmailsContainer"></div>
                                        </div>

                                        <div class="form-group">
                                            <label for="sponsorQuota">Cota</label>
                                            <select id="sponsorQuota" name="cota" required>
                                                <option value="">Selecione uma cota</option>
                                                <option value="Master">Master</option>
                                                <option value="Subcota G">Subcota G</option>
                                                <option value="Subcota">Subcota</option>
                                            </select>
                                        </div>

                                        <div class="form-group">
                                            <label for="sponsorComercialPlan">Plano Comercial</label>
                                            <div class="file-input-with-clear">
                                                <input type="file" id="sponsorComercialPlan" name="plano_comercial">
                                                <button type="button" class="btn-icon-remove" id="clearSponsorPlanBtn"
                                                    title="Remover arquivo" hidden>×</button>
                                            </div>
                                        </div>

                                        <div class="form-group">
                                            <label for="sponsorPhoto">Foto da empresa</label>
                                            <div class="file-input-with-clear">
                                                <input type="file" id="sponsorPhoto" name="foto"
                                                    accept="image/png,image/jpeg,image/webp">
                                                <button type="button" class="btn-icon-remove" id="clearSponsorPhotoBtn"
                                                    title="Remover foto" hidden>×</button>
                                            </div>
                                        </div>


                                        <div class="modal-cortesias-box">
                                            <h4>Cortesias do Patrocinador</h4>
                                            <div class="modal-cortesias-grid" id="modalCortesiasInputsGrid"></div>
                                        </div>

                                        <p class="profile-message" id="sponsorFormFeedback"
                                            style="color: #b42318; margin-top: 8px;"></p>

                                        <div class="form-actions">
                                            <button type="button" class="form-cancel" id="cancelSponsor">
                                                Cancelar
                                            </button>
                                            <button type="submit" class="form-submit" id="submitSponsorBtn">
                                                Cadastrar
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="patrocinadoresGrid" class="patrocinadores-grid"></div>
                </section>
            </main>
        </div>
    </div>

    <script src="../src/services/api.js"></script>
    <script src="../src/pages/historico.js"></script>
    <script src="../src/pages/dashboard.js"></script>
    <script src="../src/shared/layout.js"></script>
</body>

</html>
