<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Perfil e configurações da conta RBS">
    <title>RBS Patrocinadores | Perfil</title>
    <link rel="stylesheet" href="../assets/css/style_portal.css">
    <script src="../src/guards/security.js"></script>
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-area">
            <header class="topbar"></header>
            <main class="content">
                <section class="profile-view" id="profileView">
                    <header class="profile-header">
                        <h1>Perfil</h1>
                        <p>Atualize seu nome de exibição e gerencie a segurança da sua conta.</p>
                    </header>

                    <div class="profile-unified-card">

                        <div class="profile-column">
                            <h2>Dados da Conta</h2>
                            <div class="profile-field">
                                <label for="profileEmail">E-mail da conta</label>
                                <input id="profileEmail" name="email" type="email" readonly>
                                <small>O e-mail utilizado para autenticação não pode ser alterado.</small>
                            </div>

                            <form id="usernameForm">
                                <div class="profile-field">
                                    <label for="profileUsername">Nome de usuário</label>
                                    <input id="profileUsername" name="username" type="text" maxlength="80" required>
                                    <small>Este nome é exibido no cabeçalho superior da plataforma.</small>
                                </div>
                                <p class="profile-message" id="usernameMessage" role="status" aria-live="polite"></p>
                                <div class="profile-actions">
                                    <button class="button button-primary profile-save" type="submit">Salvar
                                        nome</button>
                                </div>
                            </form>
                        </div>

                        <div class="profile-column">
                            <h2>Trocar Senha</h2>
                            <form id="profileForm">
                                <div class="profile-field">
                                    <label for="currentPassword">Senha atual</label>
                                    <input id="currentPassword" name="currentPassword" type="password"
                                        autocomplete="current-password" required>
                                </div>
                                <div class="profile-field">
                                    <label for="newPassword">Nova senha</label>
                                    <input id="newPassword" name="newPassword" type="password" minlength="8"
                                        autocomplete="new-password" required>
                                </div>
                                <div class="profile-field">
                                    <label for="confirmPassword">Confirmar nova senha</label>
                                    <input id="confirmPassword" name="confirmPassword" type="password" minlength="8"
                                        autocomplete="new-password" required>
                                </div>
                                <p class="profile-message" id="profileMessage" role="status" aria-live="polite"></p>
                                <div class="profile-actions">
                                    <button class="button button-primary profile-save" type="submit">Atualizar
                                        senha</button>
                                    <button type="button" class="btn-acao-pequeno" id="toggleAllPasswordsBtn"
                                        aria-pressed="false">
                                        Mostrar senhas
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="../src/services/api.js"></script>
    <script src="../src/pages/historico.js"></script>
    <script src="../src/shared/layout.js"></script>
    <script src="../src/pages/perfil.js"></script>
</body>

</html>
